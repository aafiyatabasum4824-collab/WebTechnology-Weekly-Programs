<!DOCTYPE html>
<html>
<head>
    <title>Simple Interest Calculator</title>
    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        h2 {
            color: darkblue;
        }
        .container {
            margin-bottom: 20px;
            padding: 15px;
            border: 2px solid #333;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        label {
            display: inline-block;
            width: 180px;
            margin-bottom: 8px;
        }
        input {
            padding: 5px;
            margin-bottom: 10px;
        }
        button {
            padding: 8px 15px;
            background-color: darkblue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: navy;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Simple Interest Calculator</h2>
        <label>Customer Name:</label>
        <input type="text" id="custName"><br>

        <label>Principal Amount:</label>
        <input type="number" id="principal"><br>

        <label>Rate of Interest (%):</label>
        <input type="number" id="rate"><br>

        <label>Time (Years):</label>
        <input type="number" id="time"><br>

        <button onclick="calculateSI()">Calculate SI</button>
    </div>

    <div class="container">
        <h2>Interest Information</h2>
        <label>Name:</label>
        <input type="text" id="outName" readonly><br>

        <label>Principal Amount:</label>
        <input type="text" id="outPrincipal" readonly><br>

        <label>Simple Interest:</label>
        <input type="text" id="outSI" readonly><br>

        <label>Total Amount:</label>
        <input type="text" id="outTotal" readonly><br>
    </div>

    <script>
        function calculateSI() {
            // Get input values
            let name = document.getElementById("custName").value;
            let principal = parseFloat(document.getElementById("principal").value);
            let rate = parseFloat(document.getElementById("rate").value);
            let time = parseFloat(document.getElementById("time").value);

            // Calculate simple interest
            let si = (principal * rate * time) / 100;
            let total = principal + si;

            // Display results
            document.getElementById("outName").value = name;
            document.getElementById("outPrincipal").value = principal.toFixed(2);
            document.getElementById("outSI").value = si.toFixed(2);
            document.getElementById("outTotal").value = total.toFixed(2);
        }
    </script>

</body>
</html>
