<!DOCTYPE html>
<html>
<head>
    <title>Bank Loan Application Form</title>
    <style>
        body {
            background-color: #e6f2ff;
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        h2 {
            color: darkblue;
        }
        .container {
            margin-bottom: 20px;
            padding: 15px;
            border: 2px solid #333;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        label {
            display: inline-block;
            width: 200px;
            margin-bottom: 8px;
        }
        input {
            padding: 5px;
            margin-bottom: 10px;
        }
        button {
            padding: 8px 15px;
            background-color: darkblue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: navy;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Bank Loan Application Form</h2>
        <label>Customer Name:</label>
        <input type="text" id="custName"><br>

        <label>Occupation:</label>
        <input type="text" id="occupation"><br>

        <label>Loan Amount (₹):</label>
        <input type="number" id="loanAmount"><br>

        <label>Rate of Interest (% p.a.):</label>
        <input type="number" id="rate"><br>

        <label>Tenure (Years):</label>
        <input type="number" id="tenure"><br>

        <button onclick="calculateEMI()">Calculate EMI</button>
    </div>

    <div class="container">
        <h2>Loan Information</h2>
        <label>Name:</label>
        <input type="text" id="outName" readonly><br>

        <label>Occupation:</label>
        <input type="text" id="outOccupation" readonly><br>

        <label>Loan Amount:</label>
        <input type="text" id="outLoan" readonly><br>

        <label>Monthly EMI:</label>
        <input type="text" id="outEMI" readonly><br>

        <label>Total Payment:</label>
        <input type="text" id="outTotal" readonly><br>
    </div>

    <script>
        function calculateEMI() {
            let name = document.getElementById("custName").value;
            let occupation = document.getElementById("occupation").value;
            let loanAmount = parseFloat(document.getElementById("loanAmount").value);
            let rate = parseFloat(document.getElementById("rate").value);
            let tenure = parseFloat(document.getElementById("tenure").value);

            
            let monthlyRate = rate / 12 / 100;
            let months = tenure * 12;

            let emi = (loanAmount * monthlyRate * Math.pow(1 + monthlyRate, months)) / 
                      (Math.pow(1 + monthlyRate, months) - 1);

            let totalPayment = emi * months;

            
            document.getElementById("outName").value = name;
            document.getElementById("outOccupation").value = occupation;
            document.getElementById("outLoan").value = loanAmount.toFixed(2);
            document.getElementById("outEMI").value = emi.toFixed(2);
            document.getElementById("outTotal").value = totalPayment.toFixed(2);
        }
    </script>

</body>
</html>
